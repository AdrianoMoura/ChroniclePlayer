# CI runs offline checks only: unit tests + typecheck + lint.
# No YouTube API calls in CI, ever (roadmap.md M0, architecture.md §Testing).
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
