appId: dev.chronicleplayer.desktop
productName: Chronicle
copyright: Copyright © Chronicle Player contributors

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# D-050: build/icon.png is only consumed by electron-builder at package time
# for the app's own OS icon (below) — it isn't otherwise copied into the app
# bundle. The tray icon (src/platform/tray.ts) needs it available at runtime
# too, hence this extra copy into resources/.
extraResources:
  - from: build/icon.png
    to: icon.png

icon: build/icon.png

linux:
  target:
    - AppImage
  category: AudioVideo
  icon: build/icon.png

mac:
  target:
    - dmg
  icon: build/icon.png
  identity: null
  hardenedRuntime: false

win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

publish:
  provider: github
  owner: AdrianoMoura
  repo: ChroniclePlayer
  releaseType: draft
